[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scpi-sim"
version = "0.1.0"
description = "A simulated SCPI bench instrument and a matching Python driver."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Osama" }]
keywords = ["scpi", "ieee-488", "instrument", "test-and-measurement", "dmm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

# No runtime dependencies. The simulator and driver are pure standard library
# (socket, threading, enum, dataclasses) through Phase 4. That is deliberate:
# it keeps the core auditable and the install trivial.
dependencies = []

[project.optional-dependencies]
# Added in Phase 5.
visa = ["pyvisa>=1.14", "pyvisa-sim>=0.6"]
# Added in Phase 6.
analysis = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.14", "matplotlib>=3.9"]

# Uncomment in Phase 1, once src/scpi_sim/__main__.py exists.
# [project.scripts]
# scpi-sim = "scpi_sim.__main__:main"

# PEP 735 dependency group. Installed by `uv sync`, but never shipped to users
# who install the package itself.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

# ---------------------------------------------------------------------------
# Packaging: src layout
# ---------------------------------------------------------------------------
# Code lives in src/ rather than the repo root. This forces the tests to import
# the *installed* package instead of accidentally picking up the source folder
# from the current working directory, which is how packaging bugs stay hidden
# until someone else tries to install your project.
[tool.hatch.build.targets.wheel]
packages = ["src/scpi_sim", "src/scpi_driver"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra shows a summary line for every non-passing test.
# --strict-markers turns a typo'd @pytest.mark.foo into an error, not a silent no-op.
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: talks to a real socket; slower than the unit tests",
]

# ---------------------------------------------------------------------------
# ruff — linter and formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports, undefined names
    "I",        # isort: import ordering
    "UP",       # pyupgrade: modern syntax for your target version
    "B",        # bugbear: real bug patterns, e.g. mutable default arguments
    "ANN",      # flake8-annotations: enforces the type hints CLAUDE.md requires
    "D",        # pydocstyle: docstrings on public API
    "RUF",      # ruff's own rules
]
ignore = [
    "D203",     # conflicts with D211; pick one, this is the deprecated half
    "D213",     # conflicts with D212; multi-line summary on the first line
]

[tool.ruff.lint.per-file-ignores]
# Tests do not need module/class/function docstrings, and a test name should be
# descriptive enough on its own.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# ---------------------------------------------------------------------------
# mypy — strict, as required by CLAUDE.md
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

# Beyond --strict: these catch dead code and silently-ignored errors.
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true

# Error output that tells you which rule fired, so you can look it up.
show_error_codes = true
pretty = true
